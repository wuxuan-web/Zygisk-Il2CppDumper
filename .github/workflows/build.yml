name: Build
on:
  workflow_dispatch:
      inputs:
        package_name:
          description: "Package name of the game:"
          required: true
          default: "com.miHoYo.Yuanshen"
        lib_name:
          description: "IL2CPP library name (default: libil2cpp.so):"
          required: false
          default: "libil2cpp.so"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 11
        cache: gradle
    - run: |
        chmod +x ./gradlew
        sed -i 's/moduleDescription = "/moduleDescription = "(${{ github.event.inputs.package_name }}) /g' module.gradle
        sed -i "s/com.game.packagename/${{ github.event.inputs.package_name }}/g" module/src/main/cpp/game.h
        LIB="${{ github.event.inputs.lib_name }}"
        if [ -n "$LIB" ] && [ "$LIB" != "libil2cpp.so" ]; then
          sed -i "s|libil2cpp.so|$LIB|g" module/src/main/cpp/game.h
        fi
        ./gradlew :module:assembleRelease
    - uses: actions/upload-artifact@v4
      with:
        name: zygisk-il2cppdumper
        path: out/magisk_module_release/
